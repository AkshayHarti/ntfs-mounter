name: test
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install uv
      - run: uv sync --group dev --extra web
      - run: uv run pytest -q
      - run: node --check ntfsmnt/web/page/app.js
      - run: npm --prefix npm test
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install uv
      - run: uv build
      - name: Wheel smoke test in a clean venv
        run: |
          python -m venv /tmp/ntfsmnt-smoke
          /tmp/ntfsmnt-smoke/bin/pip install dist/*.whl
          /tmp/ntfsmnt-smoke/bin/ntfsmnt --help
