<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ntfsmnt — agent</title>
  <link rel="stylesheet" href="/static/app.css">
  <link rel="stylesheet" href="/static/agent.css">
</head>
<body>
  <header class="masthead">
    <div class="masthead__identity">
      <h1 class="wordmark"><a href="/agent">ntfsmnt</a></h1>
      <span class="badge badge--root">agent</span>
    </div>
    <span class="live" id="live" data-live="connecting">live</span>
  </header>

  <div id="alert" role="alert" class="alert" hidden></div>

  <main class="agent">
    <nav class="agentnav" aria-label="Prompts and pages">
      <button type="button" class="chip" data-ask="show me the volumes">Volumes</button>
      <button type="button" class="chip" data-ask="run the doctor">Doctor</button>
      <button type="button" class="chip" data-ask="what can you do?">What can you do?</button>
      <a class="chip" href="/">Classic dashboard</a>
    </nav>

    <div class="thread" id="feed" role="log" aria-live="polite"
         aria-label="Conversation"></div>

    <details class="logpanel" id="activity">
      <summary>Agent activity <span id="activity-count"></span></summary>
      <div class="logpanel__body">
        <button type="button" class="chip" id="activity-refresh">Refresh</button>
        <ul class="activity" id="activity-list"></ul>
      </div>
    </details>

    <form class="composer" id="composer">
      <textarea id="input" rows="2" aria-label="Ask the agent"
                placeholder="“mount HD1”, “run the doctor”, “what can you do?”"></textarea>
      <button type="submit">Send</button>
    </form>
  </main>

  <script src="/static/opui-lang.js" defer></script>
  <script src="/static/agent.js" defer></script>
</body>
</html>
